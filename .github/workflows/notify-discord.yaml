name: Discord Notify

on:
  release:
    types: [published]

jobs:
  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        uses: cabrera-evil/discord-notify-action@1.1.1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          title: 'GitHub Release Notification'
          description: 'A new release has been published.'
          avatar_url: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'
          username: 'GitHub'
          color: '#24292e'
          status: 'success'
          environment: 'production'
          include_image: 'true'
          custom_image_url: ''
          repo_name: ${{ github.repository }}
          repo_url: ${{ github.event.repository.html_url }}
          commit_message: ${{ github.event.release.body }}
          commit_sha: ${{ github.event.release.target_commitish }}
          author: ${{ github.actor }}
